<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --bg: #ffffff;
    --card-bg: #f8fafc;
    --text: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --online: #16a34a;
    --working: #f59e0b;
    --error: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111827;
      --card-bg: #1f2937;
      --text: #f9fafb;
      --muted: #9ca3af;
      --line: #374151;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --online: #22c55e;
      --working: #fbbf24;
      --error: #ef4444;
    }
  }

  * { box-sizing: border-box; }
  body {
    width: 320px;
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font: 13.5px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .app-name {
    font-size: 14.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 38px;
    height: 20px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #9ca3af;
    transition: 0.2s;
    border-radius: 20px;
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 14px; width: 14px;
    left: 3px; bottom: 3px;
    background-color: white;
    transition: 0.2s;
    border-radius: 50%;
  }
  input:checked + .slider { background-color: var(--accent); }
  input:checked + .slider:before { transform: translateX(18px); }

  /* Status Hero Card */
  .status-card {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 12px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .indicator-ring {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    margin-top: 3px;
    flex-shrink: 0;
    position: relative;
    background: #9ca3af;
  }
  .indicator-ring.online { background: var(--online); box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2); }
  .indicator-ring.working { background: var(--working); box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2); animation: pulse 1.5s infinite; }
  .indicator-ring.portal, .indicator-ring.failed { background: var(--error); box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2); }
  .indicator-ring.disabled { background: #6b7280; }

  @keyframes pulse {
    0% { transform: scale(0.95); opacity: 0.8; }
    50% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(0.95); opacity: 0.8; }
  }

  .status-details { flex-grow: 1; overflow: hidden; }
  .status-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 2px;
    word-break: break-word;
  }
  .status-meta {
    font-size: 11.5px;
    color: var(--muted);
  }

  /* Actions */
  button {
    width: 100%;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--card-bg);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.15s;
    margin-top: 6px;
  }
  button:hover { background: var(--line); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
  }
  button.primary:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }

  /* Activity Snapshot */
  .section-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 12px 0 6px;
  }
  .activity-feed {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 11.5px;
  }
  .feed-item {
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
    gap: 6px;
  }
  .feed-item:last-child { margin-bottom: 0; }
  .feed-text {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .feed-time { color: var(--muted); flex-shrink: 0; }

  /* Footer */
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    padding-top: 8px;
    border-top: 1px solid var(--line);
    font-size: 12px;
  }
  .footer a {
    color: var(--accent);
    text-decoration: none;
    cursor: pointer;
    font-weight: 500;
  }
  .footer a:hover { text-decoration: underline; }
  .active-profile-info {
    color: var(--muted);
    font-size: 11.5px;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="app-name">
      <img src="icons/icon48.png" width="18" height="18" style="border-radius:4px;" alt="Wavvy">
      Wavvy
    </div>
    <label class="switch" title="Toggle Auto-Login">
      <input type="checkbox" id="enabled-toggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="status-card">
    <div id="status-ring" class="indicator-ring"></div>
    <div class="status-details">
      <div id="status-text" class="status-title">Checking network...</div>
      <div id="status-subtext" class="status-meta">Initializing</div>
    </div>
  </div>

  <button id="check-btn" class="primary">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
    </svg>
    Check &amp; Connect Now
  </button>

  <div class="section-label">Recent Activity</div>
  <div id="activity-box" class="activity-feed">
    <div class="feed-item"><span class="feed-text">Loading events...</span></div>
  </div>

  <div class="footer">
    <span id="profiles-count" class="active-profile-info">0 profiles configured</span>
    <a id="open-settings-link">Settings &rarr;</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
